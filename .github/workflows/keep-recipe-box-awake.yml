# Supabase pauses free projects after 7 days without activity. If that happened,
# the Family Recipe Box at /recipes would stop loading. This makes one tiny call
# each day that reads no recipes, so the database never looks idle.
# If the database doesn't answer (for example it was paused anyway), the run fails
# and GitHub emails the repository owner with a link to unpause it.
name: Keep recipe box database awake

on:
  schedule:
    - cron: '41 10 * * *' # every day, 10:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: recipes/config.js
          sparse-checkout-cone-mode: false

      - name: Ping the database
        run: |
          url=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" recipes/config.js)
          key=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" recipes/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "No database set up in recipes/config.js; nothing to do."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "apikey: $key" -H 'Content-Type: application/json' -d '{}' "$url/rest/v1/rpc/rb_ping")
          echo "Database answered with HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 400 ]; then
            echo "::error::The Family Recipe Box database did not answer. It may be paused: unpause it at https://supabase.com/dashboard/project/$(echo "$url" | sed "s|https://||; s|\.supabase\.co||")"
            exit 1
          fi
