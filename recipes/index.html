<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savor</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Savor">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="food-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="food-icon-512.png">
<link rel="icon" href="food-icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="180x180" href="food-icon-180.png">
<script src="config.js?v=3"></script>
<script src="shim.js?v=14"></script>
<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-size:16px}
img{max-width:100%}
.keyscreen{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.keyscreen .box{max-width:440px;width:100%;display:grid;gap:12px}
.keyscreen h2{font-size:1.6rem}
.storenote{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 40px 10px 14px;font-size:.88rem;color:var(--ink)}
.storenote button{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer}
.keyscreen p{margin:0;color:var(--muted)}
.keyscreen form{display:flex;gap:8px;flex-wrap:wrap}
.keyscreen .inp,.keyscreen input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px}
</style>
</head><body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap">
<style>
/* Layout (Savor): a left sidebar for navigation and collections, a main column with a quiet header, the library as a card grid; a recipe opens as a full page; cooking is one step at a time. */
:root{
  --bg:#f7f9fc; --surface:#ffffff; --sunk:#edf2f9; --line:#dfe6ef;
  --ink:#243a56; --muted:#758397; --accent:#3267a8; --accent-ink:#ffffff;
  --butter:#d9e7f8; --butter-ink:#254f85; --danger:#a34535;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --r:12px; --side:#edf2f9; --active:#d9e7f8; --soft:#e3edf9; --tagbg:#eaf1fb; --tagink:#52749a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a2a; --surface:#19283e; --sunk:#152237; --line:#2c3d55;
  --ink:#e5edf8; --muted:#a1b2ca; --accent:#4385d6; --accent-ink:#ffffff;
  --butter:#263d5d; --butter-ink:#b7d5fb; --danger:#ff9c8f; --side:#152237; --active:#263d5d; --soft:#1c304c; --tagbg:#263c58; --tagink:#bcd7fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a2a; --surface:#19283e; --sunk:#152237; --line:#2c3d55;
  --ink:#e5edf8; --muted:#a1b2ca; --accent:#4385d6; --accent-ink:#ffffff;
  --butter:#263d5d; --butter-ink:#b7d5fb; --danger:#ff9c8f; --side:#152237; --active:#263d5d; --soft:#1c304c; --tagbg:#263c58; --tagink:#bcd7fa; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.homelink{color:inherit;text-decoration:none}
.homelink:hover{color:var(--accent)}
.homebtn{order:-1}
.spinning svg{animation:sp .8s linear infinite}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--sunk);color:var(--danger)}
select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.brand .count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:transparent;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--mono);font-size:.72rem;background:var(--butter);color:var(--butter-ink);border-radius:999px;padding:0 7px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px 10px 40px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer;color:var(--muted)}
.chip.book{border-style:solid;border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{position:relative}
.card .cbody{gap:5px}
.card .kicker{color:var(--muted)}
.card.featured{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card.featured .kicker,.card.featured .by,.card.featured .meta{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.card.featured .src{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:var(--accent-ink)}
.card.featured .thumb{background:transparent}
.cover.feat{background:var(--accent);color:var(--accent-ink)}
.cover.feat svg{width:40%;max-width:96px}
.ctags{display:flex;gap:5px;flex-wrap:wrap}
.ctags span{font-size:.75rem;font-weight:600;border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--accent-ink) 12%,transparent)}
.src.strong{font-weight:700;color:var(--ink)}
.card .by b{font-weight:800}
.card.dragging{opacity:.5}
.planit{align-self:flex-start;margin-top:4px}
@media (hover:hover) and (pointer:fine){.planit{display:none}}
.planlayout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.planmain{min-width:0}
.planner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 150px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.planner.dropping .pl-drop{border-color:var(--accent)}
.pl-head{display:flex;align-items:center;justify-content:space-between}
.pl-head h3{font-size:1.05rem}
.pl-nav .x{font-size:1.2rem;padding:2px 8px}
.pl-search{position:relative}
.pl-search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px 8px 32px;font-size:.9rem}
.pl-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pl-results{list-style:none;margin:-4px 0 0;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:grid;gap:2px}
.pl-results button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:5px 6px;border-radius:7px;cursor:pointer;text-align:left;font-weight:600;font-size:.88rem}
.pl-results button:hover{background:var(--sunk)}
.pl-mini{position:relative;width:34px;height:28px;border-radius:5px;overflow:hidden;flex:none;display:block}
.pl-mini img,.pl-mini .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl-mini .cover svg,.pl-mini .cover span,.pl-thumb .cover span{display:none}
.pl-pick{background:var(--sunk);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.pl-pick b{flex:1;min-width:0}
.pl-week{font-weight:700;font-size:.95rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:.8rem;padding:0}
.pl-day{display:grid;gap:4px;border-radius:10px;padding:2px}
.pl-day.over{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pl-day.target{outline:1px dashed var(--accent);outline-offset:2px}
.pl-dname{font-weight:600;font-size:.9rem}
.pl-dname small{color:var(--accent);font-weight:600;margin-left:4px}
.pl-day.today .pl-dname{color:var(--accent)}
.pl-slots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-thumb{position:relative;width:58px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:grab}
.pl-thumb a{display:block;width:100%;height:100%}
.pl-thumb img,.pl-thumb .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl-thumb .cover svg{width:60%}
.pl-rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.75rem;line-height:1;cursor:pointer;opacity:0}
.pl-thumb:hover .pl-rm,.pl-thumb:focus-within .pl-rm{opacity:1}
@media (hover:none){.pl-rm{opacity:1}}
.pl-drop{width:58px;height:48px;border:1.5px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:1.4rem;cursor:pointer;display:grid;place-items:center;flex:none}
.pl-drop:hover{border-color:var(--accent);color:var(--accent)}
.pl-drop.compact{width:36px}
.pl-hint{font-size:.82rem;color:var(--muted)}
.pl-caption{font-size:.8rem;color:var(--ink)}
.pl-shop{justify-content:center;margin-top:4px}
@media (max-width:900px){.planlayout{grid-template-columns:minmax(0,1fr)}.planner{position:static;max-height:none;order:-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:4/3;width:100%;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
/* Photos are pinned to their frame's edges: Safari sizes a photo by its own shape otherwise, ignoring the frame */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover{--h:140;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;color:hsl(var(--h) 45% 96%);background:radial-gradient(circle at 30% 25%,hsl(calc(var(--h) + 25) 55% 48%),hsl(var(--h) 50% 30%) 70%)}
.cover svg{width:44%;max-width:110px;height:auto}
.cover span{font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.15;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover.big span{font-size:1.5rem}
.photo-prev .cover span{font-size:.7rem}
.hero .thumb{position:relative}
.herophoto{display:grid;gap:10px;min-width:0}
.phototools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pastebox{flex:1 1 200px;min-width:0;min-height:38px;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;background:var(--bg);color:var(--ink);cursor:text;outline:none}
.pastebox:empty::before{content:attr(data-ph);color:var(--muted)}
.pastebox:focus{border-color:var(--accent)}
.thumb .ph{font-family:var(--display);font-weight:800;font-size:2.6rem;color:var(--line)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{font-size:1.08rem;font-weight:700}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.src{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);padding:2px 7px;border-radius:6px;color:var(--ink)}
.by{margin-top:auto;font-size:.8rem;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:1.4rem}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%;max-width:720px;margin-top:8px;text-align:left}
.steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem}
.steps3 b{display:block;font-family:var(--display)}

/* detail */
.back{margin-bottom:14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start;margin-bottom:28px}
.hero .thumb{border-radius:var(--r)}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:84px}
.fact small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fact b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.nutri{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.88rem;margin-top:8px}
.nutri .fact{min-width:70px;padding:6px 10px}
.nutri .est{color:var(--muted);font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.inline-panel{margin-top:12px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:28px}
.panel h3{font-size:1.2rem;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scaler{display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-size:.85rem;font-weight:500;background:var(--sunk);border-radius:999px;padding:3px}
.scaler button{border:0;background:var(--surface);width:28px;height:28px;border-radius:50%;cursor:pointer;font-weight:700}
.scaler span{min-width:74px;text-align:center;font-family:var(--mono)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;font-family:var(--body);font-size:.8rem;font-weight:600}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
ul.ing{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.ing label{display:flex;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
ul.ing label:hover{background:var(--sunk)}
ul.ing input{margin-top:5px;accent-color:var(--accent);width:17px;height:17px;flex:none}
ul.ing input:checked + span{text-decoration:line-through;color:var(--muted)}
.qty{font-family:var(--mono);font-size:.92em;background:var(--butter);color:var(--butter-ink);padding:0 5px;border-radius:5px}
ol.method{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
ol.method li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
ol.method li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:1.1rem;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.notes{margin-top:24px;background:var(--sunk);border-radius:12px;padding:14px 16px;white-space:pre-wrap}
.notes b{display:block;font-family:var(--display);margin-bottom:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.tag.book{border-color:var(--accent);color:var(--accent)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

/* cook mode */
.cook{max-width:760px;margin:0 auto;display:grid;gap:18px}
.cook-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cook-top h2{font-size:1.2rem;margin-right:auto}
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.stepno{font-family:var(--mono);color:var(--muted);font-size:.9rem}
.steptext{font-size:clamp(1.35rem,3.6vw,2rem);line-height:1.35;font-weight:500;min-height:6em}
.timers{display:flex;gap:8px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer.ring{background:var(--butter);color:var(--butter-ink);border-color:var(--butter)}
.cook-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cook-nav .btn{justify-content:center;padding:16px;font-size:1.1rem}
details.ingbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.ingbox summary{cursor:pointer;font-weight:600}

/* plan */
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.weekbar h2{font-size:1.5rem;margin-right:auto}
.days{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.day.today{border-color:var(--accent);border-width:2px}
.dname{font-family:var(--display);font-weight:700;line-height:1.15}
.dname small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:.82rem}
.entries{display:grid;gap:6px}
.entry{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 10px;min-width:0}
.entry .ml{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:66px;flex:none}
.entry a{font-weight:600;color:var(--ink);text-decoration:none;flex:1;min-width:0;overflow-wrap:anywhere}
.entry a:hover{text-decoration:underline}
.entry .sv{font-size:.8rem;color:var(--muted);white-space:nowrap}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* grocery */

.addbar{display:flex;gap:8px;margin-bottom:18px;max-width:760px}
.addbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}
.aisle h3{font-size:.8rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:500}

.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.choice{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;display:grid;gap:6px}

.choice span{color:var(--muted)}

.cats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}

.lp{position:relative}
.lp-menu li.lp-group{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:default;padding:10px 10px 2px}
.lp-g{margin-left:8px;color:var(--muted);font-size:.75rem}
.lbl-g{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:5px}
.lbl-g:empty{display:none}
.kicker{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.facets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.facet{display:flex;flex-direction:column;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted);flex:1 1 150px;max-width:240px}
.facet select{font-size:.9rem;font-weight:500;color:var(--ink);background:var(--surface)}
.lp-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;min-height:44px}
.lp-box:focus-within{border-color:var(--accent)}
.lp-chips{display:contents}
.lp-in{flex:1 1 140px;min-width:0;border:0;background:transparent;padding:4px;outline:none}
.lp-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.lp-menu li{padding:7px 10px;border-radius:7px;cursor:pointer}
.lp-menu li.hi{background:var(--sunk)}
.lp-menu li.create{color:var(--accent);font-weight:600}
.invite select{border-radius:999px}
.rolesel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:.85rem;font-weight:600}
.people .who{flex:1;min-width:0;overflow-wrap:anywhere}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:0}
.roles div{background:var(--sunk);border-radius:10px;padding:8px 12px}
.roles dt{font-weight:700;font-size:.9rem}
.roles dd{margin:0;font-size:.82rem;color:var(--muted)}
.sendbox{display:grid;gap:8px;border:2px solid var(--accent);border-radius:12px;padding:12px;font-size:.92rem}
.invmsg{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:.88rem;background:var(--sunk);border-radius:8px;padding:10px 12px;user-select:all}
.results{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.results li{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px;min-height:42px}
.results .who{flex:1;min-width:0;overflow-wrap:anywhere}
.reqs{display:grid;gap:8px;border:2px solid var(--butter);border-radius:12px;padding:10px}
.reqs h4{margin:0;font-family:var(--display)}
.people{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.people li{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px;min-height:40px}
.people li > span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.codebox summary{cursor:pointer;font-weight:600;color:var(--accent)}
.bookmenu{position:relative}
.bookbtn{cursor:pointer;background:transparent;}
.bm{position:absolute;left:0;top:calc(100% + 6px);z-index:12;min-width:260px;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgb(0 0 0 / .2);display:grid}
.bm-label{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 4px}
.bm button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.bm button:hover,.bm button:focus-visible{background:var(--sunk);outline:none}
.bm button[aria-checked="true"]{color:var(--accent)}
.bm-check{width:16px;flex:none;text-align:center;color:var(--accent)}
.bm hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.bookbtn{font-family:var(--body);font-weight:600;font-size:.9rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.bookbtn:hover{border-color:var(--accent)}
.brand{flex-wrap:wrap}
.startwrap{max-width:860px;margin:0 auto;display:grid;gap:20px}
.starthead h2{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:8px}
.starthead p{margin:0;color:var(--muted);max-width:60ch}
.members{display:flex;gap:6px;flex-wrap:wrap}
.codeRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:8px 8px 8px 12px}
.codeRow code{font-family:var(--mono);font-size:1.2rem;letter-spacing:.08em;flex:1 1 auto}
.linkTxt{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-size:.85rem;color:var(--muted);user-select:all}
.note{margin:0;font-size:.88rem;color:var(--muted);border-left:3px solid var(--butter);padding-left:10px}
.booklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.booklist li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px;font-weight:600}
.sharepanel{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .55);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px))}
.sharepanel .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:460px;width:100%;display:grid;gap:12px}
.linkbox{font-family:var(--mono);font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.notes.sources ul{margin:4px 0 0;padding-left:18px}
.notes.sources li{margin:2px 0}
.suggestbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.9rem}
.suggestbar > span:first-child{flex:1 1 240px}
.inferbar{background:var(--sunk);border-left:4px solid var(--butter);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.review{background:var(--butter);color:var(--butter-ink);border-radius:6px;padding:0 7px;font-weight:600;font-size:.75rem}
.reviewbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--butter);color:var(--butter-ink);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.reviewbar span{margin-right:auto;font-weight:600}
.ibx{display:grid;gap:22px;max-width:860px}
.ibx-form{display:grid;gap:12px}
.ilist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ilist li{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.ilist li:first-child{border-top:0;padding-top:0}
.imain{flex:1 1 280px;min-width:0}
.iurl{overflow-wrap:anywhere}
.inote{font-size:.9rem;margin-top:4px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.inote.warn{color:var(--muted);font-style:italic}
.iact{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem;max-height:320px;overflow:auto}
.log li.ok{color:var(--accent)} .log li.skip{color:var(--muted)} .log li.err{color:var(--danger)} .log li.wip{color:var(--muted)}
/* editor */
.editor{max-width:820px;margin:0 auto;display:grid;gap:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.box h3{font-size:1.15rem}
.box .hint{margin:-6px 0 0;color:var(--muted);font-size:.9rem}
.claude-box{border-color:var(--accent);border-width:2px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:.9rem}
.field small{color:var(--muted);font-size:.8rem}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.field textarea{min-height:110px;resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent)}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots figure{margin:0;position:relative;width:72px;height:96px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.shots img{width:100%;height:100%;object-fit:cover}
.shots figcaption{position:absolute;left:3px;bottom:3px;font-size:.62rem;font-family:var(--mono);background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px}
.shots button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;background:var(--ink);color:var(--bg);cursor:pointer;font-size:.8rem;line-height:1}
.msg{font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--sunk);display:inline-block}
.msg.err{color:var(--danger)}
.savebar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.photo-prev.whole{cursor:default}
.fithint{color:var(--muted);font-size:.8rem}
.framebar .seg button{font-size:.8rem}
.picks{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.pick{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:3px;cursor:pointer;display:grid;gap:2px;width:96px;color:var(--muted);font-size:.7rem}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;display:block}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--accent);color:var(--accent)}
.credit{color:var(--muted);font-size:.78rem}
.cropbox .cropimg{position:absolute;max-width:none;object-fit:fill;inset:auto;width:auto;height:auto}
.cropbox.whole{background:var(--bg)}
.cropgrid{position:absolute;inset:0;pointer-events:none;border:2px solid rgb(255 255 255 / .85);border-radius:10px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .35)}
.cropgrid i{position:absolute;background:rgb(255 255 255 / .55);box-shadow:0 0 0 .5px rgb(0 0 0 / .3)}
.cropgrid i:nth-child(1){left:33.333%;top:0;bottom:0;width:1px}
.cropgrid i:nth-child(2){left:66.666%;top:0;bottom:0;width:1px}
.cropgrid i:nth-child(3){top:33.333%;left:0;right:0;height:1px}
.cropgrid i:nth-child(4){top:66.666%;left:0;right:0;height:1px}
.cropbox.whole .cropgrid i{display:none}
.zoom{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);flex:1 1 120px}
.zoom input{flex:1;accent-color:var(--accent);min-width:0}
.framebar{flex-wrap:wrap}
.photo-frame{display:grid;gap:6px;width:min(320px,100%)}
.framebar{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.photo-prev.movable{cursor:grab;touch-action:none;outline:1px solid var(--line)}
.photo-prev.movable.dragging{cursor:grabbing}
.photo-prev.movable:focus-visible{outline:3px solid var(--butter)}
.photo-prev img{pointer-events:none;user-select:none;-webkit-user-drag:none}
.photo-prev{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:.8rem}
.photo-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bookpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:760px){.hero,.cols{grid-template-columns:minmax(0,1fr)}.brand h1{font-size:1.3rem}.day{grid-template-columns:minmax(0,1fr)}.entry .ml{width:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Savor template ===== */
body{font:15px/1.55 var(--body);padding:0!important}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
.app{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);border-right:1px solid var(--line);padding:max(34px,env(safe-area-inset-top,0px)) 22px 22px max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow-y:auto;z-index:6}
.logo{font:600 38px/1 var(--display);letter-spacing:-2px;color:var(--ink);text-decoration:none}
.logo span{color:#6fa7df;font-size:.8em;margin-left:2px}
.sub{color:var(--muted);font-size:11px;letter-spacing:2px;margin-top:6px}
.nav{display:grid;gap:6px;margin:38px 0 24px;border:0;overflow:visible}
.nav .tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;border:0;color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.nav .tab:hover{background:var(--active)}
.nav .tab[aria-current="page"]{background:var(--active);color:var(--accent);font-weight:700;border:0}
:root[data-theme="dark"] .nav .tab[aria-current="page"]{color:#b7d5fb}
.nav .tab .ico{width:18px;text-align:center;opacity:.8}
.nav .tab b{margin-left:auto;font-size:12px;font-weight:600}
.nav .badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-family:var(--body)}
.label{font-size:10px;letter-spacing:1.8px;color:var(--muted);font-weight:700;margin:6px 0 10px}
.collection{display:flex;align-items:center;width:100%;text-align:left;padding:9px 8px;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink);font:inherit}
.collection:hover,.collection.on{background:var(--active)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px;flex:none}
.textbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;font:inherit;font-weight:600;padding:6px 0}
.side .textbtn{padding:9px 8px}
.profile{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:.92rem}
.avatar{background:var(--active);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.profile small{color:var(--muted)}
.mainwrap{margin-left:232px;padding:max(26px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-right,0px)) 50px 40px;max-width:1500px}
header.top{position:static;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 0 20px;margin:0 0 6px;background:transparent}
.crumb{font-size:12px;color:var(--muted);margin-right:auto}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.92)}
.btn.outline,select.outline,.outline{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px}
.title{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:28px 0 24px}
.title h1{font-size:40px;letter-spacing:-1px;margin:0 0 8px;line-height:1.1}
.title p{color:var(--muted);margin:0}
.title .note{color:#6585ab;font-family:var(--display);font-size:17px;white-space:nowrap;border:0;padding:0;margin:0;background:none}
:root[data-theme="dark"] .title .note{color:#95b7df}
.banner{background:var(--soft);border-radius:13px;display:flex;justify-content:space-between;align-items:center;padding:22px 26px;margin-bottom:30px;gap:24px}
.banner h2{font-size:23px;margin:0 0 6px}
.banner p{margin:0;color:var(--muted)}
.linkbox{display:flex;gap:8px;background:var(--surface);padding:6px;border:1px solid var(--line);border-radius:10px;width:48%;min-width:0}
.linkbox input{flex:1;min-width:0;border:0;background:transparent;padding:8px;color:var(--ink);outline:none}
.linkbox .btn{white-space:nowrap}
.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}

.shelves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.shelf{border:1px solid var(--line);border-radius:11px;background:var(--surface);text-align:left;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;color:var(--ink);font:inherit;min-width:0}

.shelf small{color:var(--muted)}
.tools{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.tools .search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:11px 15px}
.tools select{padding:10px 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.hero h2,.detail-title{font-size:clamp(1.9rem,4vw,2.6rem)}

<script>
(() => {
const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = { webResearch: !!window.RecipeBoxWeb, myEmail: '', myHash: '', inviteCheck: 'idle', bookMeta: {}, invites: [], memberInfo: {}, wasMember: false, books: [], bookId: '', bookName: '', members: [], profileReady: false, recipes: [], plan: [], grocery: [], inbox: [], loaded: false, slow: false, error: '', q: '', tag: '', book: '', mine: false,

function toast(t){ const el = document.createElement('div'); el.className='toast'; el.textContent=t; el.setAttribute('role','status'); document.body.append(el); setTimeout(()=>el.remove(), 2600); }

/* ---------- helpers ---------- */
function platform(url){

}
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
const normUrl = u => { u = String(u||'').trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)) return u; if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return 'https://'+u; return u; };
const imgSrc = r => r && r.photoId ? '/_blob/' + r.photoId : '';
const posStyle = r => { const q = r && r.photoPos, whole = r && r.photoFit === 'whole'; if(!q && !whole) return '';
  const x = q ? Math.max(0, Math.min(100, +q.x)) : 50, y = q ? Math.max(0, Math.min(100, +q.y)) : 50;

/* A photo shown whole gets a soft, darkened copy of itself behind it (a real blur, done by CSS) */

const initials = t => (t||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const byId = id => state.recipes.find(r => r.id === id);
/* Google Images search for a dish, and a box that accepts a pasted image */
const googleImg = t => 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(((t||'').trim() || 'recipe') + ' recipe');
function pasteBoxHTML(id){ return `<div class="pastebox" id="${id}" contenteditable="true" role="textbox" aria-label="Paste a copied image here" data-ph="Tap here, then Paste your copied image"></div>`; }
function bindPasteBox(el, onFile){
  if(!el) return;

    e.preventDefault(); e.stopPropagation();

  });
  el.addEventListener('input', () => { if(el.textContent) el.textContent = ''; });
  el.addEventListener('drop', e => { e.preventDefault(); const f = [...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/')); if(f) onFile(f); });

/* A designed cover for recipes with no photo: colour from the dish name, a plate, the name. */
function coverHTML(r, big){
  const t = (r && r.title) || 'Untitled recipe'; let h = 0; for(const c of t) h = (h*31 + c.charCodeAt(0)) % 360;
  const h2 = (h + 25) % 360;
  return `<div class="cover${big?' big':''}" style="background-color:hsl(${h},50%,30%);background-image:radial-gradient(circle at 30% 25%,hsl(${h2},55%,48%),hsl(${h},50%,30%) 70%);color:hsl(${h},45%,96%)" role="img" aria-label="${esc(t)}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" stroke-width="3" opacity=".55"/><circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><path d="M14 22v22M8 22v14a6 6 0 0 0 12 0V22M106 22c-6 4-8 12-8 20h8v38" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg><span>${esc(t)}</span></div>`; }

/* dates (local) */
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; return addDays(x, -wd); };
const dayName = d => d.toLocaleDateString(undefined,{weekday:'long'});
const shortDate = d => d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
const MEALS = ['Breakfast','Lunch','Dinner','Snack'];

/* ---------- quantities: parse, scale, convert ---------- */
const UF = {'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const NUM = String.raw`(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s*[½⅓⅔¼¾⅛⅜⅝⅞]|\d*\.\d+|\d+|[½⅓⅔¼¾⅛⅜⅝⅞])`;
const QRE = new RegExp('^\\s*(' + NUM + ')(?:\\s*(?:-|–|to)\\s*(' + NUM + '))?');
function val(s){ s=s.trim(); let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if((m=s.match(/^(\d+(?:\.\d+)?)\s*([½⅓⅔¼¾⅛⅜⅝⅞])$/))) return +m[1] + UF[m[2]];
  if(UF[s]!=null) return UF[s]; return parseFloat(s); }
function fmt(n){ if(!(n>0)) return '0'; const w=Math.floor(n+1e-9), f=n-w;
  if(n>=20) return String(Math.round(n));
  const fr=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞'],[1,'']];
  let best=fr[0]; for(const x of fr) if(Math.abs(f-x[0])<Math.abs(f-best[0])) best=x;
  if(Math.abs(f-best[0])>.04) return String(Math.round(n*100)/100);
  const whole = best[0]===1 ? w+1 : w; const s = best[1];
  return whole ? (s ? whole+' '+s : String(whole)) : (s || '0'); }
const UNITS = [
  [/^(cups?|c)\b\.?/i, 'cup', 'vol', 240], [/^(tablespoons?|tbsps?|tbs|tbl)\b\.?/i, 'tbsp', 'vol', 15], [/^(teaspoons?|tsps?)\b\.?/i, 'tsp', 'vol', 5],
  [/^(fl\.?\s?oz|fluid ounces?)\b\.?/i, 'fl oz', 'vol', 30], [/^(pints?|pt)\b\.?/i, 'pint', 'vol', 473], [/^(quarts?|qt)\b\.?/i, 'quart', 'vol', 946],
  [/^(ounces?|oz)\b\.?/i, 'oz', 'wt', 28.35], [/^(pounds?|lbs?)\b\.?/i, 'lb', 'wt', 453.6],
  [/^(grams?|g)\b\.?/i, 'g', 'wt', 1, true], [/^(kilograms?|kgs?)\b\.?/i, 'kg', 'wt', 1000, true],
  [/^(milliliters?|millilitres?|ml)\b\.?/i, 'ml', 'vol', 1, true], [/^(liters?|litres?|l)\b\.?/i, 'l', 'vol', 1000, true]];
const r5 = n => n < 20 ? Math.round(n) : Math.round(n/5)*5;
function toMetric(q, u){ const base = q*u[3]; if(u[2]==='wt') return base>=1000 ? [Math.round(base/100)/10,'kg'] : [r5(base),'g']; return base>=1000 ? [Math.round(base/100)/10,'l'] : [r5(base),'ml']; }
function toUS(q, u){ const base = q*u[3];
  if(u[2]==='wt') return base >= 454 ? [Math.round(base/453.6*4)/4,'lb'] : [Math.round(base/28.35*4)/4 || .25,'oz'];
  if(base >= 60) return [Math.round(base/240*4)/4,'cup']; if(base >= 15) return [Math.round(base/15*2)/2,'tbsp']; return [Math.round(base/5*4)/4 || .25,'tsp']; }
/* returns {qty:string|null, rest:string} with scale k and unit mode applied */
function shapeLine(line, k, mode){
  const m = line.match(QRE);
  if(!m) return { qty:null, rest: line };
  let a = val(m[1])*k, b = m[2] ? val(m[2])*k : null;
  let rest = line.slice(m[0].length);
  if(mode !== 'orig'){
    const lead = rest.match(/^\s*/)[0], body = rest.slice(lead.length);
    const u = UNITS.find(x => x[0].test(body));
    if(u && ((mode==='metric') !== !!u[4])){
      const conv = mode==='metric' ? toMetric : toUS;
      const [na, nu] = conv(a, u); const nb = b!=null ? conv(b, u)[0] : null;
      const unitTxt = body.match(u[0])[0];
      const plural = (na > 1 && /cup|pint|quart|lb/.test(nu)) ? (nu==='lb'?'lb':nu+'s') : nu;
      return { qty: (Number.isInteger(na) || nu==='l' || nu==='kg' ? String(na) : fmt(na)) + (nb!=null ? '–'+(Number.isInteger(nb)?nb:fmt(nb)) : '') + ' ' + plural, rest: body.slice(unitTxt.length) };

}
function lineHTML(line, k, mode){ const s = shapeLine(line, k, mode); if(s.qty==null) return esc(line);
  return '<span class="qty">'+esc(s.raw || s.qty)+'</span>'+esc(s.rest); }
function lineText(line, k, mode){ const s = shapeLine(line, k, mode); return s.qty==null ? line : ((s.raw||s.qty) + s.rest); }
function convTemps(text, mode){
  if(mode==='metric') return text.replace(/(\d{3})\s*°?\s*F\b/g, (_,f) => r5((f-32)*5/9)+'°C');

/* aisle guess for items added without Claude */
const LABEL_GROUPS = {
  'Course': ['Breakfast','Brunch','Lunch','Dinner','Appetizer','Side dish','Soup','Salad','Sandwich','Dessert','Baking','Snack','Drink','Sauce'],
  'Region': ['American','Southern','Cajun & Creole','Tex-Mex','Mexican','Latin American','Caribbean','Italian','French','Spanish','Greek','Mediterranean','Middle Eastern','North African','Indian','Thai','Chinese','Japanese','Korean','Vietnamese','Filipino'],
  'Style': ['Comfort food','Healthy','Light','Hearty','Spicy','Creamy','Cheesy','Crispy','Fresh','Smoky','Sweet & savory','Indulgent','Budget friendly','Date night'],

const GROUP_ORDER = Object.keys(LABEL_GROUPS);
const PRESET_LABELS = GROUP_ORDER.flatMap(g => LABEL_GROUPS[g]);

  for(const g of GROUP_ORDER) if(LABEL_GROUPS[g].some(x => x.toLowerCase()===k)) return g;

function watchApprovals(){

    const fresh = snap.docs.filter(d => !state.books.some(b => b.id===d.id));
    if(!fresh.length) return;
    const added = fresh.map(d => ({ id: d.id, name: d.data().name || 'Recipe book' }));

async function resolveReqNames(){ if(!state.user || !state.requests.length) return; try{ const ps = await state.user.profiles(state.requests.map(r=>r.uid)); let ch=false; for(const r of state.requests){ const n = (ps[r.uid]&&ps[r.uid].name)||''; if(state.names[r.uid]!==n){ state.names[r.uid]=n; ch=true; } } if(ch) softRender(); }catch{} }
async function resolveNames(){
  if(!state.user) return;
  const ids = [...new Set([...state.recipes.map(r=>r.addedBy), ...(state.members||[])].filter(Boolean))];
  if(!ids.length) return;
  try{ const ps = await state.user.profiles(ids); let changed=false;
    for(const id of ids){ const n = (ps[id] && ps[id].name) || ''; if(state.names[id]!==n){ state.names[id]=n; changed=true; } }

function route(){ const h = location.hash.slice(1);
  if(h==='new') return {name:'edit'};
  if(h==='favorites') return {name:'list', mode:'favorites'};
  if(h==='tocook') return {name:'list', mode:'tocook'};
  if(h==='plan') return {name:'plan'};
  if(h==='grocery') return {name:'grocery'};
  if(h==='inbox') return {name:'inbox'};
  if(h==='books') return {name:'books'};
  if(h==='start') return {name:'start'};
  if(h.startsWith('join-')) return {name:'start', code:h.slice(5)};
  if(h.startsWith('edit-')) return {name:'edit', id:h.slice(5)};
  if(h.startsWith('cook-')) return {name:'cook', id:h.slice(5)};
  if(h.startsWith('r-')) return {name:'detail', id:h.slice(2)};
  return {name:'list'}; }

function claudeErr(e){ const c = e && e.code;

Ingredients:\n${(r.ingredients||[]).join('\n')}
Return ONLY JSON: {"calories": number, "protein": grams, "carbs": grams, "fat": grams, "servingsAssumed": number}`, { modelTier:'default' });

let cookStep = 0, cookFor = '', timers = [], tick = null, audioCtx = null;
function stopCook(){ if(wakeLock){ try{ wakeLock.release(); }catch{} wakeLock=null; } }
function findTimes(s){ const out=[]; const re=/(\d+(?:\.\d+)?)\s*(?:(?:-|–|to)\s*(\d+(?:\.\d+)?)\s*)?(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi; let m;
  while((m=re.exec(s))){ const n = parseFloat(m[2]||m[1]); const u = m[3].toLowerCase(); const sec = u.startsWith('h') ? n*3600 : u.startsWith('s') ? n : n*60;
    if(sec>0 && sec<=6*3600) out.push({label: m[0], sec}); } return out; }
const clock = s => { s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
function beep(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); [0,.35,.7].forEach(t => { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.2,audioCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.3); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.3); }); }catch{} }
function drawTimers(){ const el = $('#timers'); if(!el) return;
  el.innerHTML = timers.map((t,i)=>`<button class="btn small timer${t.done?' ring':''}" type="button" data-t="${i}">⏱ ${esc(t.label)} · ${t.done?'Done!':clock((t.end-Date.now())/1000)}</button>`).join('');
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { timers.splice(+b.dataset.t,1); drawTimers(); }); }
function startTick(){ if(tick) return; tick = setInterval(() => { let any=false; timers.forEach(t => { if(!t.done && Date.now()>=t.end){ t.done=true; beep(); } if(!t.done) any=true; }); drawTimers(); if(!timers.length){ clearInterval(tick); tick=null; } }, 500); }
async function renderCook(id){
  const r = byId(id);
  if(!r){ view.innerHTML = state.loaded ? '<p class="status">Recipe not found. <a href="#">Back</a></p>' : '<p class="status">Opening recipe…</p>'; return; }
  if(cookFor!==id){ cookFor=id; cookStep=0; if(scaleFor!==id){ scale=1; scaleFor=id; } }
  const steps = r.steps||[]; const total = steps.length;
  cookStep = Math.min(cookStep, Math.max(0,total-1));
  const s = convTemps(steps[cookStep]||'', state.units);
  const times = findTimes(steps[cookStep]||'');
  view.innerHTML = `<section class="cook">
    <div class="cook-top"><h2>${esc(r.title)}</h2><button class="btn small" type="button" id="wl">${wakeLock?'Screen stays on ✓':'Keep screen on'}</button><a class="btn small" href="#r-${esc(r.id)}">Exit</a></div>
    <div class="progress" aria-hidden="true"><i style="width:${total?((cookStep+1)/total*100):0}%"></i></div>
    <div class="stepno">Step ${cookStep+1} of ${total}</div>
    <div class="steptext" aria-live="polite">${esc(s)}</div>
    <div class="timers">${times.map((t,i)=>`<button class="btn small" type="button" data-start="${i}">Start ${esc(t.label)} timer</button>`).join('')}</div>
    <div class="timers" id="timers"></div>
    <div class="cook-nav"><button class="btn" type="button" id="prev" ${cookStep===0?'disabled':''}>← Back</button>
      ${cookStep<total-1?'<button class="btn primary" type="button" id="next">Next step →</button>':`<button class="btn primary" type="button" id="cookDone">Finish cooking ✓</button>`}</div>
    <details class="ingbox"><summary>Ingredients (${(r.ingredients||[]).length})</summary><ul class="ing" style="margin-top:8px">${(r.ingredients||[]).map((l,i)=>`<li><label><input type="checkbox" id="cing-${i}"><span>${lineHTML(l,scale,state.units)}</span></label></li>`).join('')}</ul></details>
  </section>`;
  drawTimers();
  const go = d => { cookStep = Math.max(0, Math.min(total-1, cookStep+d)); renderCook(id); };
  if($('#prev')) $('#prev').onclick = () => go(-1);
  if($('#cookDone')) $('#cookDone').onclick = async () => { if(state.canWrite && !r.cooked){ try{ await bdoc('recipes/'+r.id).update({ cooked: true }); }catch{} } toast('Another delicious memory made.'); location.hash = 'r-' + r.id; };
  if($('#next')) $('#next').onclick = () => go(1);
  view.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { const t = times[+b.dataset.start]; timers.push({ label: t.label, end: Date.now()+t.sec*1000, done:false }); try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch{} startTick(); drawTimers(); });
  $('#wl').onclick = async () => {
    try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } else if(navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } else throw 0; }
    catch{ $('#wl').textContent = 'Not available here'; return; }
    $('#wl').textContent = wakeLock ? 'Screen stays on ✓' : 'Keep screen on'; };
}

async function buildGrocery(entries, btn){
  const lines = []; const forMap = [];
  for(const p of entries){ const r = byId(p.recipeId); if(!r) continue;
    const k = (p.servings && r.servings) ? p.servings / r.servings : 1;
    for(const l of (r.ingredients||[])){ lines.push(lineText(l, k, 'orig') + '   [' + r.title + ']'); } }
  if(!lines.length){ toast('Those recipes have no ingredients listed'); return; }
  btn.disabled = true; const msg = $('#buildmsg'); msg.innerHTML = '<p class="msg"><span class="spin"></span> Building your grocery list…</p>';
  let items = null;
  if(state.sample){
    try{
      const out = await state.sample.json(`Turn these recipe ingredients into one grocery shopping list. Each line ends with the recipe name in [brackets].
${lines.join('\n')}
Rules: merge the same ingredient across recipes and add up amounts when units match (otherwise list both amounts, e.g. "1 cup + 2 tbsp milk"). Leave out water. Keep it short and shoppable ("3 cloves garlic", "1 lb ground beef").
Put each item in exactly one aisle from: ${AISLES.join(', ')}.
Return ONLY JSON: {"items":[{"text":string,"aisle":string,"for":[recipe names]}]}`, { modelTier:'default' });
      if(out && Array.isArray(out.items)) items = out.items.filter(i=>i && i.text).map(i => ({ text:String(i.text), aisle: AISLES.includes(i.aisle) ? i.aisle : guessAisle(i.text), for: Array.isArray(i.for) ? i.for.map(String).slice(0,6) : [] }));
    }catch(e){ msg.innerHTML = '<p class="msg">'+esc(claudeErr(e))+' Adding ingredients one by one instead.</p>'; }
  }
  if(!items) items = lines.map(l => { const m = l.match(/^(.*?)\s{3}\[(.*)\]$/); return { text: m[1], aisle: guessAisle(m[1]), for:[m[2]] }; });
  const have = new Set(state.grocery.filter(g=>!g.checked).map(g=>g.text.toLowerCase()));
  let n = 0;
  for(const it of items){ if(have.has(it.text.toLowerCase())) continue;
    try{ await bdoc('grocery/'+newId('g')).set({ text: it.text, aisle: it.aisle, for: it.for, checked:false, addedBy: state.me||'', createdAt: Date.now()+n }); n++; }
    catch(e){ if(e.code==='quota_exceeded'){ toast('The list is full. Clear checked items and try again.'); break; } } }
  btn.disabled = false; msg.innerHTML = '';
  toast(n ? n+' items added to the grocery list' : 'Everything is already on the list');
}

/* ---------- shared: Claude reads material into a recipe ---------- */
const SCHEMA = `{"title": string, "author": creator handle or name if shown else "", "servings": number or null, "prepMinutes": number or null, "cookMinutes": number or null,
 "ingredients": [strings, one per ingredient, amount and unit first, e.g. "2 tbsp soy sauce"],
 "steps": [strings, one clear instruction each, no numbering],
 ${TAG_RULE},
 "notes": string with tips, swaps or storage advice from the source, else "",
 "sourceUrl": a link to the original recipe if one appears in the material, else "",
 "coverImage": the number (1 = first) of the attached image that best shows the finished dish, or 0 if none of them show the food (for example a screenshot of only text),
 "inferred": true if you filled in any ingredients, amounts or steps that the material did not give, else false,
 "nutrition": {"calories": number, "protein": grams, "carbs": grams, "fat": grams} estimated PER SERVING, or null if there are no ingredients}`;
const RULES = `Use what the material says first, word for word where it gives ingredients, amounts and steps. Skip hashtags, promo codes and calls to follow.
When the material shows or names a dish but leaves out the ingredients, the amounts or the steps, work the recipe out: identify the dish from the title, the photos (what you can see in the pan or on the plate), any ingredients mentioned, and words in the link (recipe-site links usually contain the dish name). Then fill the gaps with how well-known, similar recipes for that dish are made, matching what is visible and anything the creator did say, and give normal home-cook amounts for the servings. Set "inferred" to true and start "notes" with one plain sentence saying which parts came from the post and which you filled in from similar recipes.`;
/* On the website, Claude can search the web and open pages, so it researches the real recipe */
const RESEARCH = () => !state.webResearch ? '' : `
RESEARCH FIRST. You can search the web and open web pages.
- If the post link is a recipe website or blog, open it and use that recipe.
- Facebook, Instagram, TikTok and YouTube pages can't be opened. For those, search the web for the dish name (add the creator's name or handle if you know it) to find the creator's own written recipe; if you can't find it, use two or three well-reviewed recipes for the same dish and build the most typical version.
- Prefer the creator's own recipe over anyone else's. Write the steps clearly in your own words.
- Add "basedOn": [the URLs of up to 3 pages you actually used], and say in "notes" which recipe you followed.
- If nothing you find matches the dish, still answer from what you know and set "basedOn": [].`;
function recipePrompt(url, text, nImg, nVid, dish){
  return `You turn recipes shared on social media, websites, notes or photos into clean, saved recipes.
Post link: ${url || '(none)'}
${dish ? `Dish name (typed by the person saving it): ${dish}` : ''}
Caption / pasted text:
"""
${(text||'').slice(0,20000) || '(none, see the images)'}
"""
${nImg ? `Attached: ${nImg} image(s)${nVid ? `, ${nVid} of them stills taken in order from the recipe video (read any on-screen text and what is being added)` : ''}. Images may be screenshots, photos of cookbook pages or handwritten cards.` : ''}
Return ONLY a JSON object with these keys:
${SCHEMA}
${RULES}${RESEARCH()}
Only if nothing in the material identifies a dish at all, return {"error": "short reason"} (for example, a social media link with no caption, photo or dish name).`; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function completeRecipe(r, images){
  return askClaude(`Complete this saved recipe. The original post left parts out.
Dish name: ${r.title || '(not given, work it out from the photo)'}
Post link: ${r.sourceUrl || '(none)'}
${(r._caption||'').trim() ? `Original caption:\n"""\n${r._caption.slice(0,8000)}\n"""` : ''}
Ingredients already listed (keep these, add amounts where missing):\n${(r.ingredients||[]).join('\n') || '(none)'}
Steps already listed (keep these, add any missing):\n${(r.steps||[]).join('\n') || '(none)'}
Servings: ${r.servings || 'unknown'}
${images && images.length ? 'Attached: a photo of the dish. Match what you can see.' : ''}
Fill the gaps with how well-known, similar recipes for this dish are made, using normal home-cook amounts.${RESEARCH()}
Return ONLY JSON: {"title": string, "servings": number, "prepMinutes": number, "cookMinutes": number, "ingredients": [all ingredients, amount first], "steps": [all steps, no numbering], ${TAG_RULE}, "notes": "one plain sentence saying what came from the post and what you filled in from similar recipes", "nutrition": {"calories": number, "protein": grams, "carbs": grams, "fat": grams} per serving}
If you can't tell what dish this is, return {"error": "short reason"}.`, images);

/* ---------- video → frames ---------- */
async function videoFrames(file, count){
  const url = URL.createObjectURL(file);
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
  try{
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('This video format can’t be opened here. Try an .mp4.')); setTimeout(()=>rej(new Error('The video took too long to open.')), 20000); });
    const dur = v.duration; if(!isFinite(dur) || dur<=0) throw new Error('Couldn’t read the video length.');
    const W = Math.min(720, v.videoWidth||720), H = Math.round((v.videoHeight||1280) * W / (v.videoWidth||720));
    const c = document.createElement('canvas'); c.width=W; c.height=H; const ctx = c.getContext('2d');
    const out = [];
    for(let i=0;i<count;i++){
      v.currentTime = Math.min(dur-0.05, dur*(i+0.5)/count);
      await new Promise(res => { v.onseeked = res; setTimeout(res, 4000); });
      ctx.drawImage(v,0,0,W,H);
      const b = await new Promise(res => c.toBlob(res,'image/jpeg',.82)); if(b) out.push(b);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* Soft background for "Whole photo": shrink the photo to a few pixels, then stretch it back up.
   Works in every browser (iPhone Safari ignores canvas blur filters). */
function softBackdrop(ctx, im, nw, nh, OW, OH){
  const s2 = Math.max(OW/nw, OH/nh);
  const tiny = document.createElement('canvas'); tiny.width = 24; tiny.height = 18;
  const tc = tiny.getContext('2d'); tc.imageSmoothingEnabled = true; tc.imageSmoothingQuality = 'high';
  tc.drawImage(im, (24 - nw*s2*24/OW)/2, (18 - nh*s2*18/OH)/2, nw*s2*24/OW, nh*s2*18/OH);
  const mid = document.createElement('canvas'); mid.width = 96; mid.height = 72;
  const mc = mid.getContext('2d'); mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
  mc.drawImage(tiny, 0, 0, 96, 72);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(mid, -OW*0.04, -OH*0.04, OW*1.08, OH*1.08);
  ctx.fillStyle = 'rgba(10,14,22,.45)'; ctx.fillRect(0, 0, OW, OH);
}
/* A found photo cut to the card's shape: centered fill, or the whole photo with soft edges */
async function fitPhoto(blob, whole){
  const url = URL.createObjectURL(blob);
  try{ const im = new Image(); await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = url; });
    const OW = 1200, OH = 900, nw = im.naturalWidth, nh = im.naturalHeight; if(!nw || !nh) return blob;
    const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH; const ctx = cv.getContext('2d');
    if(whole) softBackdrop(ctx, im, nw, nh, OW, OH);
    const s = whole ? Math.min(OW/nw, OH/nh) : Math.max(OW/nw, OH/nh);
    ctx.drawImage(im, (OW - nw*s)/2, (OH - nh*s)/2, nw*s, nh*s);
    return await new Promise(res => cv.toBlob(b => res(b || blob), 'image/jpeg', 0.88));
  }catch{ return blob; } finally{ URL.revokeObjectURL(url); }
}
