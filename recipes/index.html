    const W = p.clientWidth, H = p.clientHeight, nw = im.naturalWidth, nh = im.naturalHeight, c = C();
    let s, left, top;
    if(c.whole){ s = Math.min(W/nw, H/nh); left = (W - nw*s)/2; top = (H - nh*s)/2; }
    else {
      s = Math.max(W/nw, H/nh) * c.zoom;
      const hw = W/(2*nw*s), hh = H/(2*nh*s);
      c.cx = Math.min(1 - hw, Math.max(hw, c.cx)); c.cy = Math.min(1 - hh, Math.max(hh, c.cy));
      left = W/2 - c.cx*nw*s; top = H/2 - c.cy*nh*s;
    }
    Object.assign(im.style, { left: left + 'px', top: top + 'px', width: nw*s + 'px', height: nh*s + 'px' });
    cropLayout = { W, H, s, left, top, nw, nh, whole: c.whole };
    const ff = $('#fitFill'), fw = $('#fitWhole'); if(ff) ff.setAttribute('aria-pressed', String(!c.whole)); if(fw) fw.setAttribute('aria-pressed', String(c.whole));
    const zw = $('#zoomWrap'); if(zw) zw.hidden = c.whole;
    const zi = $('#zoomIn'); if(zi && +zi.value !== c.zoom) zi.value = c.zoom;
    const h = $('#fitHint'); if(h) h.textContent = c.whole ? 'The whole photo shows, with its edges softly filled to the card’s shape.' : 'Drag the photo and zoom to fit the grid. What’s inside the frame is what shows on the card.';
    p.classList.toggle('whole', c.whole);
  }
  async function exportCrop(force){
    const L = cropLayout, im = cropImg;
    if(!L || !im || !im.naturalWidth || !(force || d._cropDirty)) return null;
    const OW = 1200, OH = 900, k = OW / L.W;
    const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH; const ctx = cv.getContext('2d');
    if(L.whole){
      softBackdrop(ctx, im, L.nw, L.nh, OW, OH);
    }
    ctx.drawImage(im, L.left*k, L.top*k, L.nw*L.s*k, L.nh*L.s*k);
    return await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.88));
  }
  (() => { const p = $('#pprev'); if(!p) return;
    const pts = new Map(); let start = null;
    const snap = () => ({ ...C(), pts: [...pts.values()].map(q => ({ ...q })) });
    p.addEventListener('pointerdown', e => { if(!cropImg || C().whole) return; e.preventDefault(); p.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); start = snap(); p.classList.add('dragging'); });
    p.addEventListener('pointermove', e => { if(!pts.has(e.pointerId) || !cropLayout || !start) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); const c = C(), L = cropLayout, now = [...pts.values()];
      if(now.length >= 2 && start.pts.length >= 2){ // pinch to zoom
        const dist = a => Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        c.zoom = Math.min(4, Math.max(1, start.zoom * dist(now) / Math.max(1, dist(start.pts))));
      } else if(now.length === 1 && start.pts.length === 1){
        c.cx = start.cx - (now[0].x - start.pts[0].x) / (L.nw * L.s);
        c.cy = start.cy - (now[0].y - start.pts[0].y) / (L.nh * L.s);
      }
      d._cropDirty = true; layoutCrop(); });
    const end = e => { pts.delete(e.pointerId); start = pts.size ? snap() : null; if(!pts.size) p.classList.remove('dragging'); };
    p.addEventListener('pointerup', end); p.addEventListener('pointercancel', end);
    p.addEventListener('keydown', e => { if(!cropImg) return; const c = C(); const step = 0.04 / c.zoom;
      const m = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] }[e.key];
      if(m){ e.preventDefault(); c.cx += m[0]; c.cy += m[1]; }
      else if(e.key === '+' || e.key === '='){ c.zoom = Math.min(4, c.zoom * 1.1); }
      else if(e.key === '-'){ c.zoom = Math.max(1, c.zoom / 1.1); } else return;
      d._cropDirty = true; layoutCrop(); });
    const zi = $('#zoomIn'); if(zi) zi.oninput = () => { C().zoom = +zi.value; d._cropDirty = true; layoutCrop(); };
    const cb = $('#centerBtn'); if(cb) cb.onclick = () => { Object.assign(C(), { zoom: 1, cx: 0.5, cy: 0.5 }); d._cropDirty = true; layoutCrop(); };
    const ff = $('#fitFill'), fw = $('#fitWhole');
    if(ff) ff.onclick = () => { C().whole = false; d._cropDirty = true; layoutCrop(); };
    if(fw) fw.onclick = () => { C().whole = true; d._cropDirty = true; layoutCrop(); };
    window.addEventListener('resize', layoutCrop);
  })();
  drawPreview();

  /* cookbooks */
  view.querySelectorAll('[data-book]').forEach(b => b.onclick = () => { sync(); const k=b.dataset.book; d.cookbooks = d.cookbooks.includes(k) ? d.cookbooks.filter(x=>x!==k) : [...d.cookbooks, k]; b.setAttribute('aria-pressed', d.cookbooks.includes(k)); });
  const addBook = () => { const t = $('#newBook').value.trim().slice(0,40); if(!t) return; sync(); if(!d.cookbooks.includes(t)) d.cookbooks.push(t); renderEditor(id); };
  $('#addBook').onclick = addBook;
  $('#newBook').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); addBook(); } });

  /* screenshots + video */
  const showShots = () => { const el = $('#shots'); if(!el) return;
    el.innerHTML = ''; shots.forEach((s,i) => { const fig = document.createElement('figure'); const im = document.createElement('img');
      im.src = s.url; im.alt = (s.video?'Video still ':'Screenshot ')+(i+1); const x = document.createElement('button'); x.type='button'; x.textContent='×'; x.setAttribute('aria-label','Remove image '+(i+1));
      x.onclick = () => { shots.splice(i,1); if(d._cover!=null && d._cover>i) d._cover--; else if(d._cover===i) d._cover = shots.length ? 0 : null; showShots(); };
      im.style.cursor='pointer'; im.title='Use as the recipe photo'; im.onclick = () => { d._cover = i; showShots(); };
      fig.append(im,x);
      const isCover = !photoFile && !d.photoId && coverIdx()===i;
      if(s.video || isCover){ const cap=document.createElement('figcaption'); cap.textContent = isCover ? '★ photo' : 'video'; fig.append(cap); } el.append(fig); });
    drawPreview(); };
  const addFiles = async files => {
    const vm = $('#vidmsg');
    for(const f of files){
      if(shots.length >= state.imgMax){ if(vm) vm.innerHTML = '<span class="msg">That’s the most images Claude can read at once ('+state.imgMax+').</span>'; break; }
      if(f.type.startsWith('image/')) shots.push({ blob:f, url:URL.createObjectURL(f) });
      else if(f.type.startsWith('video/')){
        if(vm) vm.innerHTML = '<span class="msg"><span class="spin"></span> Taking stills from the video…</span>';
        try{ const room = state.imgMax - shots.length; const fr = await videoFrames(f, Math.max(1, room));
          fr.forEach(b => shots.push({ blob:b, url:URL.createObjectURL(b), video:true }));
          if(vm) vm.innerHTML = '<span class="msg">Took '+fr.length+' stills from the video. Remove any that don’t help.</span>'; }
        catch(err){ if(vm) vm.innerHTML = '<span class="msg err">'+esc(err.message||'Couldn’t read that video.')+'</span>'; }
      }
    }
    showShots(); };
  if($('#f-shots')){
    $('#f-shots').onchange = e => { const fs=[...e.target.files]; e.target.value=''; addFiles(fs); };
    const drop = $('#drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); });
    form.addEventListener('paste', e => { const fs=[...(e.clipboardData?.files||[])]; if(fs.length){ e.preventDefault(); addFiles(fs); } });
    showShots();
  }
  if($('#f-photo')) $('#f-photo').onchange = e => { photoFile = e.target.files[0] || null; d.photoPos = null; d.photoFit = null; d._crop = null; d._cropDirty = false; d.photoCredit = ''; const p=$('#pprev');
    drawPreview(); if($('#shots')) showShots(); };

  bindPasteBox($('#editPaste'), f => { photoFile = f; d.photoPos = null; d.photoFit = null; d._crop = null; d._cropDirty = false; d.photoCredit = ''; drawPreview(); if($('#shots')) showShots(); toast('Photo added. It saves with the recipe.'); });
  const gi = $('#gImg'); if(gi) form.addEventListener('input', e => { if(e.target.id==='f-title' || e.target.id==='f-dish') gi.href = googleImg(e.target.value); });
  d.tags = canonList(d.tags); labelPicker($('#editCats'), d.tags.slice(), list => { d.tags = list; });
  const fp = $('#findPhoto'); if(fp) fp.onclick = async () => { sync(); fp.disabled = true; fp.textContent = 'Looking…';
    try{ const list = await window.RecipeBoxWeb.findPhotos(photoPages(d), d.title || d._dish); d._photoPicks = list;
      if(!list.length) toast('No photo found on those pages. Try Find a photo on Google.');
      else { usePick(d, list[0]); toast(list.length > 1 ? 'Picked the best of ' + list.length + ' photos. Tap another below to switch.' : 'Found a photo.'); } }
    catch(e){ toast(claudeErr(e)); }
    renderEditor(id); };
  view.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { sync(); const pk = d._photoPicks[+b.dataset.pick]; if(!pk) return;
    usePick(d, pk); renderEditor(id); });
  const ca = $('#claudeAgain'); if(ca) ca.onclick = async () => { ca.disabled = true; ca.textContent = 'Checking…'; await recheckClaude();
    if(state.sample){ d._mode = undefined; renderEditor(id); } else { ca.disabled = false; ca.textContent = 'Still off. Check again'; } };
  const sw = $('#switchMode'); if(sw) sw.onclick = () => { sync(); d._mode = mode==='link' ? 'manual' : 'link'; d._readMsg=''; renderEditor(id); };
  const mh = $('#moreHelp'); if(mh) mh.onclick = () => { sync(); d._needHelp = true; d._readMsg=''; renderEditor(id); };
  if($('#f-url') && mode==='link'){ const u = $('#f-url'); let last = '';
    const t = $('#f-dish');
    const go = () => { const b = $('#read'); if(b && !b.disabled && u.value.trim() && t.value.trim()) b.click(); };
    u.addEventListener('paste', () => setTimeout(() => { if(t.value.trim()) go(); else t.focus(); }, 0));
    u.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); if(t.value.trim()) go(); else t.focus(); } });
    t.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); go(); } }); }

  /* Claude completes a recipe the post left unfinished */
  const sg = $('#suggest');
  if(sg) sg.onclick = async () => {
    sync(); const m = $('#sugmsg');
    if(!d.title && !shots.length && !photoFile && !d.photoId && !(d._caption||'').trim()){ m.innerHTML = '<span class="msg err">Type the dish name first.</span>'; return; }
    sg.disabled = true; m.innerHTML = '<span class="msg"><span class="spin"></span> Working it out…</span>';
    try{
      const imgs = shots.map(s=>s.blob); if(!imgs.length){ const pb = photoFile || (d.photoId ? await blobFromAsset(d.photoId) : null); if(pb) imgs.push(pb); }
      const out = await completeRecipe(d, imgs);
      if(!out || out.error){ m.innerHTML = '<span class="msg err">'+esc(out?.error || 'Claude couldn’t tell what dish this is.')+'</span>'; return; }
      mergeSuggestion(d, out); renderEditor(id); autoPhotoFor(id);
      $('#sugmsg').innerHTML = '<span class="msg">Filled in from similar recipes. Check it over, then save.</span>';
    }catch(e){ m.innerHTML = '<span class="msg err">'+esc(claudeErr(e))+'</span>'; }
    finally{ const b=$('#suggest'); if(b) b.disabled=false; }
  };

  /* Save the link and title now; Claude fills in the rest in the background */
  const slBtn = $('#saveLater');
  if(slBtn) slBtn.onclick = async () => {
    sync(); const msg = $('#readmsg');
    if(!d._dish){ msg.innerHTML = '<span class="msg err">Type the dish’s title.</span>'; $('#f-dish').focus(); return; }
    if(shots.length){ msg.innerHTML = '<span class="msg err">Claude has to read screenshots now. Tap Get the recipe instead.</span>'; return; }
    slBtn.disabled = true;
    try{
      const url = normUrl(d.sourceUrl), rid = newId('r');
      const doc = { title: d._dish, sourceUrl: url, platform: platform(url), author: '', ingredients: [], steps: [], tags: [], cookbooks: [], notes: '', photoId: '', needsReview: true,
        fillStatus: 'pending', fillCaption: String(d._caption||'').slice(0, 3000), addedBy: state.me||'', createdAt: Date.now(), updatedAt: Date.now() };
      await bdoc('recipes/'+rid).set(doc);
      draft = null; toast('Saved. Claude is filling it in…'); location.hash = '';
      fillLater(rid, { id: rid, ...doc });
    }catch(e){ slBtn.disabled = false; msg.innerHTML = '<span class="msg err">Couldn’t save ('+esc(e.code||'error')+'). Try again.</span>'; }
  };

  /* Claude reads the post */
  const readBtn = $('#read');
  if(readBtn) readBtn.onclick = async () => {
    sync(); const msg = $('#readmsg');
    if(!d._dish){ msg.innerHTML = '<span class="msg err">Type the dish’s title.</span>'; $('#f-dish').focus(); return; }
    const hit = !d._noReuse && !shots.length && !(d._caption||'').trim() ? findReuse(d.sourceUrl) : null;
    if(hit){ const f = reuseFields(hit);
      d._filled = true; d.title = d._dish || d.title || hit.title; Object.assign(d, { ingredients: f.ingredients.slice(), steps: f.steps.slice(), tags: f.tags.slice(), notes: f.notes, inferred: f.inferred, basedOn: f.basedOn.slice(), nutrition: f.nutrition });
      for(const k of ['servings','prepMinutes','cookMinutes','author']) if(f[k]) d[k] = f[k];
      if(f.photoId && !photoFile && !d.photoId){ d.photoId = f.photoId; d.photoCredit = f.photoCredit; d.photoFit = f.photoFit; d.photoPos = f.photoPos; }
      d._readMsg = '<span class="msg">Already looked up: reused the details from “'+esc(hit.title||'this recipe')+'”, saved earlier from the same link. <button class="btn small" type="button" id="lookFresh">Look it up again</button></span>';
      renderEditor(id); return; }
    readBtn.disabled = true; msg.innerHTML = '<span class="msg"><span class="spin"></span> '+(state.webResearch ? 'Searching the web and writing the recipe… about 15 to 20 seconds' : 'Reading the recipe…')+'</span>';
    const nVid = shots.filter(s=>s.video).length;
    const prompt = recipePrompt(d.sourceUrl, d._caption, shots.length, nVid, d._dish || (d._filled ? d.title : ''));
    /* Start on the photo right away, in parallel with the recipe */
    const early = canFindPhotos() && d.sourceUrl && !photoFile && !d.photoId && !shots.length
      ? window.RecipeBoxWeb.findPhotos(photoPages({ sourceUrl: d.sourceUrl }), d._dish).catch(() => []) : null;
    try{
      const blobs = shots.map(s=>s.blob);
      const full = askClaude(prompt, blobs); full.catch(() => {}); d._full = full; d._fullDone = false;
      let out, isDraft = false;
      if(state.webResearch){
        /* a quick draft (a few seconds) while the researched recipe is still being written */
        const dr = askDraft(d._dish, d.sourceUrl, d._caption, blobs).then(o => o && !o.error ? { o, draft: true } : new Promise(() => {}), () => new Promise(() => {}));
        const first = await Promise.race([dr, full.then(o => ({ o, draft: false }))]);
        out = first.o; isDraft = first.draft;
      } else out = await full;
      if(!out || out.error){
        let saved = false;
        if(!d._inboxId && d.sourceUrl){ try{ const iid = newId('i'); await bdoc('inbox/'+iid).set({ url: d.sourceUrl, note: d._dish||'', shotIds: [], addedBy: state.me||'', createdAt: Date.now() }); d._inboxId = iid; saved = true; }catch{} }
        d._readMsg = '<span class="msg err">Claude couldn’t make a recipe for “'+esc(d._dish)+'”'+(out && out.error ? ': '+esc(out.error) : '.')+' Try a more specific title, like “creamy Tuscan chicken pasta”.'+(d._inboxId ? ' The link is saved in your Inbox.' : '')+'</span>';
        renderEditor(id); return; }
      d._touched = false; d._research = null;
      applyReadOut(d, out, isDraft);
      renderEditor(id); autoPhotoFor(id, early);
      if(isDraft){
        const real = await full.catch(() => null); d._fullDone = true;
        if(draft === d && real && !real.error){
          if(!d._touched){ applyReadOut(d, real, false); d._autoRefreshed = true; }
          else { d._research = real; d._readMsg = '<span class="msg">The researched recipe is ready. <button class="btn small" type="button" id="useResearch">Use it (replaces what’s below)</button></span>'; }
          if(route().name === 'edit'){ renderEditor(id); autoPhotoFor(id); }
        } else if(draft === d){ d._readMsg = '<span class="msg">Quick draft from similar recipes. Check it over below, then save.</span>'; if(route().name === 'edit') renderEditor(id); }
      }
    }catch(e){ msg.innerHTML = '<span class="msg err">'+esc(claudeErr(e))+' Or fill it in by hand.</span>'; }
    finally{ const b=$('#read'); if(b) b.disabled=false; }
  };

  form.addEventListener('submit', async e => {
    e.preventDefault(); sync();
    const sm = $('#savemsg');
    if(!d.title){ sm.innerHTML='<span class="msg err">Give the recipe a name.</span>'; $('#f-title').focus(); return; }
    const btn = $('#save'); btn.disabled = true; sm.innerHTML = '<span class="msg"><span class="spin"></span> Saving…</span>';
    try{
      const ci = coverIdx();
      let photoId = d.photoId || (!photoFile && ci>=0 && shots[ci].assetId) || '';
      let up = photoFile || (!photoId && ci>=0 && shots[ci].blob) || null;
      const cropped = await exportCrop(!!up);
      if(cropped){ up = cropped; photoId = ''; d.photoPos = null; d.photoFit = null; }
      if(up && state.assets){ try{ const a = await state.assets.upload(up); photoId = a.id; }catch(err){ toast('Photo didn’t upload; saved without it'); } }
      const num = x => { const v = Number(x); return Number.isFinite(v) && v>0 ? v : null; };
      const nu = d.nutrition && (d.nutrition.calories||d.nutrition.protein||d.nutrition.carbs||d.nutrition.fat) ? d.nutrition : null;
      const srcUrl = normUrl(d.sourceUrl);
      const body = { title:d.title, sourceUrl:srcUrl, platform: platform(srcUrl), author:d.author,
        servings:num(d.servings), prepMinutes:num(d.prepMinutes), cookMinutes:num(d.cookMinutes),
        ingredients:d.ingredients, steps:d.steps, tags:d.tags, cookbooks:d.cookbooks, notes:d.notes, photoId, photoPos: d.photoPos || null, photoFit: d.photoFit === 'whole' ? 'whole' : null, photoCredit: d.photoCredit || '', basedOn: d.basedOn || [], nutrition: nu, needsReview: false, inferred: !!d.inferred,
        addedBy: existing ? (existing.addedBy||state.me||'') : (state.me||''), createdAt: existing ? (existing.createdAt||Date.now()) : Date.now(), updatedAt: Date.now() };
      if(existing){ for(const k of ['favorite','cooked']) if(existing[k] != null) body[k] = existing[k]; }
      const rid = id || newId('r');
      const lateFull = d._full && !d._fullDone ? d._full : null;
      if(lateFull) Object.assign(body, { fillStatus: 'working', fillClaim: Date.now(), seenWhileFilling: true, researchOnly: true, fillCaption: String(d._caption||'').slice(0, 3000) });
      await bdoc('recipes/'+rid).set(body);
      if(lateFull) lateResearch(rid, lateFull);
      if(d._inboxId){ try{ await bdoc('inbox/'+d._inboxId).delete(); }catch{} }
      draft = null; shots = []; photoFile = null;
      location.hash = 'r-' + rid; toast(id ? 'Changes saved' : 'Saved to Savor');
    }catch(err){
      btn.disabled = false;
      const c = err && err.code;
      sm.innerHTML = '<span class="msg err">'+esc(c==='invalid_argument' ? 'You don’t have permission to save here. Ask the owner to make you an Editor.' : c==='quota_exceeded' ? 'The recipe box is full. Delete a few old recipes and try again.' : 'Couldn’t save ('+(c||'error')+'). Try again.')+'</span>';
    }
  });
}

boot();
})();
</script>
